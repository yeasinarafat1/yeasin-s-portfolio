  <path d="M392 216h420" stroke="#FFFFFF" stroke-opacity=".12"/><g font-family="Consolas,monospace" font-size="13"><text x="395" y="250" fill="#7EA4D3">01</text><text x="430" y="250" fill="#F4C879">const</text><text x="475" y="250" fill="#EAF0F8">debounce = (fn, delay) =&gt; {</text><text x="395" y="281" fill="#7EA4D3">02</text><text x="451" y="281" fill="#FF8192">let</text><text x="477" y="281" fill="#EAF0F8">timer;</text><text x="395" y="312" fill="#7EA4D3">03</text><text x="451" y="312" fill="#FF8192">return</text><text x="497" y="312" fill="#A9DDBE">(...args) =&gt; {</text><text x="395" y="343" fill="#7EA4D3">04</text><text x="469" y="343" fill="#EAF0F8">clearTimeout(timer);</text><text x="395" y="374" fill="#7EA4D3">05</text><text x="469" y="374" fill="#EAF0F8">timer = setTimeout(() =&gt;</text><text x="395" y="405" fill="#7EA4D3">06</text><text x="487" y="405" fill="#EAF0F8">fn(...args), delay);</text><text x="395" y="436" fill="#7EA4D3">07</text><text x="451" y="436" fill="#A9DDBE">};</text><text x="395" y="467" fill="#7EA4D3">08</text><text x="430" y="467" fill="#EAF0F8">};</text></g>
